spring:
  application:
    name: TelemetryService
  datasource:
    url: jdbc:postgresql://localhost:5434/telemetry_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      max-lifetime: 1200000
      register-mbeans: false
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092} # Адрес Kafka брокера
    consumer:
      group-id: telemetry-service-group          # ID группы потребителей
      auto-offset-reset: earliest   # Стартовая позиция при отсутствии смещения
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
server:
  port: 8086

